name: Keep Supabase awake

# Free Supabase projects pause after a week with little activity. This runs a tiny query twice a
# week. GitHub turns off scheduled workflows in repositories with no commits for 60 days.
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Query the database
        run: |
          url=$(grep -E '^VITE_SUPABASE_URL=' .env | cut -d= -f2- | tr -d '[:space:]')
          key=$(grep -E '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2- | tr -d '[:space:]')
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Supabase is not configured in .env; nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$url/rest/v1/rpc/ping" \
            -H "apikey: $key" -H "Content-Type: application/json" -d '{}'
